services:
  - type: web
    name: arcadenet-api
    runtime: node
    plan: free
    branch: main
    # npm ci omits devDependencies when NODE_ENV=production; Nest CLI is needed to compile.
    buildCommand: npm ci --include=dev && npm run build -w @arcadenet/server
    startCommand: node apps/server/dist/src/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://arcadenet.vercel.app
